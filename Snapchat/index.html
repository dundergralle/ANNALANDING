/* overlay */
body::before {
  content:''; position:fixed; inset:0;
  background: rgba(0,30,80,0.18);
  pointer-events:none; z-index:0;
}

.wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 380px;
}

/* AVATAR */
.av-wrap {
  position: relative;
  width: 108px; height: 108px;
  margin-bottom: 0.8rem;
}
.av-ring {
  position: absolute; inset: -4px; border-radius: 50%;
  background: conic-gradient(#fff, #d0eeff, #fff, #b0d8ff, #fff);
  animation: spin 6s linear infinite;
  box-shadow: 0 0 18px rgba(255,255,255,0.8);
}
@keyframes spin { to { transform: rotate(360deg); } }
.av-inner {
  position: absolute; inset: 4px; border-radius: 50%;
  background: #1a5aa0; z-index:1;
}
.av-img {
  position: absolute; inset: 5px; z-index: 2;
  width: calc(100% - 10px); height: calc(100% - 10px);
  border-radius: 50%; object-fit: cover; display: block;
}

/* NAME */
h1 {
  font-size: 2rem; font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 20px rgba(80,160,255,0.4);
  margin-bottom: 0.3rem; text-align: center;
  letter-spacing: -0.01em;
}

/* LOCATION */
.loc {
  font-size: 0.82rem; font-weight: 500;
  color: rgba(255,255,255,0.92);
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  margin-bottom: 1.2rem;
  display: flex; align-items: center; gap: 4px;
}

/* BUTTONS */
.btns {
  display: flex; flex-direction: column; gap: 0.7rem;
  width: 100%;
}

.btn {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 54px;
  border-radius: 999px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.45);
  box-shadow:
    0 4px 18px rgba(0,40,120,0.35),
    inset 0 1px 0 rgba(255,255,255,0.5),
    inset 0 -1px 0 rgba(0,40,120,0.2);
  color: #fff;
  font-family: 'SuperWater', sans-serif;
  font-size: 1.3rem; font-weight: 400; letter-spacing: 0.06em;
  letter-spacing: 0.04em;
  text-decoration: none; text-align: center;
  text-shadow: 0 1px 4px rgba(0,20,80,0.5);
  cursor: pointer; touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  transition: transform 0.1s, opacity 0.1s;
}

.btn-primary {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.6);
  box-shadow:
    0 4px 20px rgba(0,40,140,0.4),
    inset 0 1.5px 0 rgba(255,255,255,0.6),
    inset 0 -1.5px 0 rgba(0,40,140,0.25);
  font-size: 1.1rem; font-weight: 700;
  letter-spacing: 0.07em;
}

.btn:active { transform: scale(0.97); opacity: 0.85; }
@media (hover:hover) { .btn:hover { opacity: 0.88; } }

/* shimmer */
.btn::after {
  content:''; position:absolute; top:0; left:-100%;
  width:50%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  animation: shimmer 4s ease-in-out infinite;
}
@keyframes shimmer {
  0%,50% { left:-100%; opacity:0; }
  55% { opacity:1; }
  100% { left:140%; opacity:0; }
}

/* bubbles */
.bubble {
  position:absolute; border-radius:50%;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  animation: rise linear infinite;
  pointer-events:none;
}
@keyframes rise {
  0%   { transform:translateY(0) scale(1); opacity:0.6; }
  100% { transform:translateY(-55px) scale(0.5); opacity:0; }
}

/* shake */
@keyframes shake {
  0%,100% { transform:translateX(0); }
  20% { transform:translateX(-5px); }
  40% { transform:translateX(5px); }
  60% { transform:translateX(-4px); }
  80% { transform:translateX(4px); }
}
.btn.shaking { animation: shake 0.5s ease; }

@media (max-width:400px) {
  h1 { font-size: 1.7rem; }
  .btn { height: 50px; font-size: 0.98rem; }
  .btn-primary { font-size: 1rem; }
}
@media (max-height:640px) {
  .av-wrap { width:88px; height:88px; margin-bottom:0.5rem; }
  h1 { font-size: 1.5rem; }
  .btns { gap: 0.4rem; }
  .btn { height: 48px; }
}

<script>
(function(){
  var f=['Stockholm','Göteborg','Malmö','Uppsala','Linköping','Örebro','Västerås',
    'Helsingborg','Norrköping','Jönköping','Umeå','Lund','Gävle','Borås','Sundsvall',

  function setCity(c){document.getElementById('loc-text').textContent='5 minutes ago in: '+(c&&c.trim().length>1?c.trim():f[Math.floor(Math.random()*f.length)]);}
  function get(u,e){return fetch(u,{cache:'no-store'}).then(r=>r.json()).then(d=>{var v=e(d);if(!v||v.trim().length<2)throw 0;return v;});}
  get('https://ipinfo.io/json',d=>d&&d.city)
    .catch(()=>get('https://ip-api.com/json/?fields=city,regionName',d=>d&&(d.city||d.regionName)))
    .catch(()=>get('https://ipapi.co/json/',d=>d&&(d.city||d.region)))
    .then(setCity).catch(()=>setCity(null));
})();
</script>
<script>
(function(){
  var b=document.querySelector('.btn-shake');
  if(!b)return;
  function shake(){b.classList.add('shaking');b.addEventListener('animationend',function h(){b.removeEventListener('animationend',h);b.classList.remove('shaking');setTimeout(shake,4000);});}
  setTimeout(shake,3000);
})();
</script>

  });
})();
